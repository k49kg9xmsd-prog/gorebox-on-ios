name: GoreBoxPOC
options:
  bundleIdPrefix: com.localresearch
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    PRODUCT_NAME: GoreBoxPOC
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
targets:
  GoreBoxPOC:
    type: application
    platform: iOS
    sources:
      - path: GoreBoxPOC/Sources
    resources:
      - path: GoreBoxPOC/Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localresearch.goreboxpoc
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        ONLY_ACTIVE_ARCH: NO
    scheme:
      gatherCoverageData: false
