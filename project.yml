name: GoreBoxRunner
options:
  bundleIdPrefix: com.localresearch
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: 15.0
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    PRODUCT_NAME: GoreBoxRunner
    CURRENT_PROJECT_VERSION: 10
    MARKETING_VERSION: 1.0.0
    CODE_SIGN_STYLE: Automatic
targets:
  GoreBoxRunner:
    type: application
    platform: iOS
    sources:
      - path: Sources/AppDelegate.swift
      - path: Sources/RunnerViewController.swift
      - path: Sources/ELFParser.swift
      - path: Sources/BinaryBundle.swift
      - path: Sources/CompatibilityDiagnostics.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localresearch.goreboxrunner
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ENABLE_BITCODE: NO
        SUPPORTS_MACCATALYST: NO
        ONLY_ACTIVE_ARCH: NO
    scheme:
      gatherCoverageData: false
