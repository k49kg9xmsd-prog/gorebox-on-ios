workflows:
  gorebox-oneclick-recover:
    name: GoreBox One-Click - Recover Unity Project
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
    scripts:
      - name: Prepare build
        script: |
          mkdir -p BuildArtifacts
          echo "STARTED" > BuildArtifacts/Status.txt
          date > BuildArtifacts/StartedAt.txt
      - name: Download one source archive
        script: |
          bash Tools/DownloadAndPrepare.sh
      - name: Recover original Unity project
        script: |
          bash Tools/Recover.sh
      - name: Package recovered project
        script: |
          bash Tools/PackageRecovered.sh
    artifacts:
      - BuildArtifacts/**

  gorebox-oneclick-full-ipa:
    name: GoreBox One-Click - Recover + Unity iOS + Unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      xcode: latest
      unity: 2021.3.28f1
      vars:
        BUNDLE_ID: "com.gorebox.ios.port"
    scripts:
      - name: Prepare build
        script: |
          mkdir -p BuildArtifacts
          echo "STARTED" > BuildArtifacts/Status.txt
          date > BuildArtifacts/StartedAt.txt
      - name: Check Unity credentials
        script: |
          bash Tools/CheckUnityLicense.sh
      - name: Activate Unity license
        script: |
          "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile BuildArtifacts/UnityActivation.log \
            -serial "$UNITY_SERIAL" -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD"
      - name: Download one source archive
        script: |
          bash Tools/DownloadAndPrepare.sh
      - name: Recover original Unity project
        script: |
          bash Tools/Recover.sh
      - name: Add iOS build overlay
        script: |
          bash Tools/AddIOSOverlay.sh
      - name: Export Unity project to Xcode
        script: |
          bash Tools/ExportIOS.sh
      - name: Build unsigned iOS app and IPA
        script: |
          bash Tools/BuildUnsignedIPA.sh
    artifacts:
      - BuildArtifacts/**
    publishing:
      scripts:
        - name: Return Unity license
          script: |
            if [ -n "${UNITY_EMAIL:-}" ] && [ -n "${UNITY_PASSWORD:-}" ]; then
              "$UNITY_HOME/Contents/MacOS/Unity" -batchmode -quit -logFile BuildArtifacts/UnityReturn.log \
                -returnlicense -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" || true
            fi
