workflows:
  ios-unsigned-ipa:
    name: GoreBox POC - Unsigned iPhone/iPad IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: GoreBoxPOC
        XCODE_PROJECT: GoreBoxPOC.xcodeproj
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen || true
          xcodegen --version
      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml
      - name: Build unsigned iOS device app
        script: |
          set -euo pipefail
          rm -rf build
          mkdir -p build
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$CM_BUILD_DIR/build/xcodebuild-device.log"
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/GoreBoxPOC.app"
          test -d "$APP"
          rm -rf "$CM_BUILD_DIR/build/ipa"
          mkdir -p "$CM_BUILD_DIR/build/ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/ipa/Payload/"
          cd "$CM_BUILD_DIR/build/ipa"
          /usr/bin/zip -qry GoreBoxPOC-unsigned.ipa Payload
          /usr/bin/unzip -l GoreBoxPOC-unsigned.ipa | head -40
    artifacts:
      - build/ipa/*.ipa
      - build/DerivedData/Build/Products/Release-iphoneos/*.app
      - build/*.log

  ios-simulator:
    name: GoreBox POC - iOS Simulator
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
      vars:
        XCODE_SCHEME: GoreBoxPOC
        XCODE_PROJECT: GoreBoxPOC.xcodeproj
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen || brew upgrade xcodegen || true
      - name: Generate Xcode project
        script: |
          xcodegen generate --spec project.yml
      - name: Build simulator app
        script: |
          set -euo pipefail
          rm -rf build-sim
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build-sim/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | tee "$CM_BUILD_DIR/simulator-build.log"
    artifacts:
      - build-sim/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - simulator-build.log
