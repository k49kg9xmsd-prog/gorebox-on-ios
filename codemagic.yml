workflows:
  gorebox-real-port-stage1-recover-v2:
    name: GoreBox REAL Port Stage 1 V2 - Recover Original Unity Project
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Create visible artifact folder
        script: |
          mkdir -p BuildArtifacts
          echo "Codemagic started" > BuildArtifacts/CodemagicStarted.txt
          pwd > BuildArtifacts/WorkingDirectory.txt
          find . -maxdepth 3 -type f | sort > BuildArtifacts/RepositoryFiles.txt
      - name: Recover original GoreBox Unity project
        script: |
          bash Tools/RecoverProject.sh
      - name: Verify output artifact
        script: |
          test -s BuildArtifacts/GoreBox_13.7.9_REAL_Recovered_Unity_Project.zip
          ls -lh BuildArtifacts
    artifacts:
      - BuildArtifacts/**
